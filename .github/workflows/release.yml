# Release (03 §13): a v* tag builds every platform and publishes a GitHub Release
# with ANet-Relay-<ver>-<os>-<arch>.<ext> packages, SHA256SUMS.txt and the notes
# from the matching CHANGELOG.md section. Run by hand (workflow_dispatch) it only builds the packages and keeps
# them as workflow artifacts: a dry run for packaging and macOS signing changes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.12.0"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # Windows is a should-have for v0.1 (R-64): its failure does not block the release.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: mac-arm64, runner: macos-15, platform: mac, arch: arm64, optional: false }
          # macos-13 and macos-14 have been retired by GitHub; macos-15 is arm64, macos-15-intel x64.
          - { label: mac-x64, runner: macos-15-intel, platform: mac, arch: x64, optional: false }
          - { label: linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64, optional: false }
          - { label: win-x64, runner: windows-2022, platform: win, arch: x64, optional: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install shell dependencies
        run: npm ci

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Build web interface
        run: npm run build:web

      - name: Build backend (PyInstaller)
        run: npm run build:backend

      # Developer ID signing and notarization when the repository has the secrets; without them the
      # macOS packages keep the ad-hoc signature (scripts/after-pack.cjs). Nothing is printed from the secrets.
      - name: Import Developer ID certificate (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "${CSC_LINK}" ]; then
            echo "No CSC_LINK secret: packaging with an ad-hoc signature."
            exit 0
          fi
          keychain="${RUNNER_TEMP}/relay-signing.keychain-db"
          kpass="$(openssl rand -hex 24)"
          security create-keychain -p "${kpass}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${kpass}" "${keychain}"
          printf '%s' "${CSC_LINK}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security import "${RUNNER_TEMP}/developer-id.p12" -P "${CSC_KEY_PASSWORD}" -f pkcs12 -k "${keychain}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${kpass}" "${keychain}" > /dev/null
          # A .p12 exported from Keychain Access carries the certificate and key but not Apple's Developer ID G2
          # intermediate; without it the identity is untrusted and find-identity -v drops it.
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${keychain}" || true
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          # Certificate type and validity only; the holder's name is masked.
          echo "Code-signing identities in CSC_LINK:"
          security find-identity -p codesigning "${keychain}" | sed -E 's/"([^":]+):[^"]*"/"\1: ..."/'
          identity="$(security find-identity -v -p codesigning "${keychain}" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "${identity}" ]; then
            echo "CSC_LINK holds no valid Developer ID Application identity: export the Developer ID Application certificate together with its private key (My Certificates in Keychain Access) as .p12." >&2
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          echo "MAC_SIGN_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          if [ -n "${APPLE_API_KEY_P8}" ]; then
            printf '%s\n' "${APPLE_API_KEY_P8}" > "${RUNNER_TEMP}/AuthKey.p8"
            chmod 600 "${RUNNER_TEMP}/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8"
              echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "MAC_NOTARIZE=required"
            } >> "${GITHUB_ENV}"
            echo "Developer ID signing and notarization enabled."
          else
            echo "Developer ID signing enabled; no APPLE_API_KEY_P8 secret, so the app is not notarized."
          fi

      - name: Package (electron-builder)
        run: node scripts/dist.mjs ${{ matrix.platform }} --prebuilt --arch ${{ matrix.arch }}

      # 05 §3: the DMG layout can only be checked on macOS. Mount the image, list .background/ and .DS_Store, and
      # capture the Finder window when the runner allows screen capture. Informational: never fails the build.
      - name: Check DMG layout (macOS)
        if: matrix.platform == 'mac'
        continue-on-error: true
        run: |
          shopt -s nullglob
          mkdir -p dmg-check
          dmgs=(release/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "No DMG was built." | tee dmg-check/layout.txt
            exit 0
          fi
          dmg="${dmgs[0]}"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mnt}" "${dmg}" > /dev/null
          {
            echo "DMG: $(basename "${dmg}")"
            ls -la "${mnt}"
            if [ -d "${mnt}/.background" ]; then ls -la "${mnt}/.background"; else echo "missing .background/"; fi
            if [ -f "${mnt}/.DS_Store" ]; then echo ".DS_Store present"; else echo "missing .DS_Store"; fi
          } | tee dmg-check/layout.txt
          hdiutil detach "${mnt}" -quiet || true
          # Finder applies the window layout from .DS_Store when the volume is opened normally
          if hdiutil attach -readonly "${dmg}" > dmg-check/attach.txt; then
            vol="$(awk -F'\t' '/\/Volumes\// {print $NF}' dmg-check/attach.txt | tail -n 1)"
            if [ -n "${vol}" ]; then
              open "${vol}" || true
              sleep 6
              screencapture -x dmg-check/finder-${{ matrix.arch }}.png || echo "screencapture unavailable" | tee -a dmg-check/layout.txt
              osascript -e 'tell application "Finder" to close every window' || true
              hdiutil detach "${vol}" -quiet || true
            fi
          fi

      - name: Upload DMG layout check (macOS)
        if: matrix.platform == 'mac'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-check-${{ matrix.label }}
          path: dmg-check/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material (macOS)
        if: always() && matrix.platform == 'mac'
        run: |
          rm -f "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          if [ -f "${RUNNER_TEMP}/relay-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/relay-signing.keychain-db" || true
          fi

      - name: Collect packages
        run: node scripts/release-assets.mjs collect upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.label }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Check required packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in mac-arm64.zip mac-x64.zip linux-x64.tar.gz linux-x64.AppImage; do
            test -f "dist/ANet-Relay-${version}-${f}" || { echo "missing ANet-Relay-${version}-${f}" >&2; exit 1; }
          done
          ls -l dist

      - name: Checksums
        run: node scripts/release-assets.mjs checksums dist

      - name: Release notes
        run: node scripts/release-assets.mjs notes "${GITHUB_REF_NAME}" release-notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ANet Relay ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
