# Release (03 §13): a v* tag builds every platform and publishes a GitHub Release
# with ANet-Relay-<ver>-<os>-<arch>.<ext> packages, SHA256SUMS.txt and the notes
# from the matching CHANGELOG.md section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.12.0"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # Windows is a should-have for v0.1 (R-64): its failure does not block the release.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: mac-arm64, runner: macos-14, platform: mac, arch: arm64, optional: false }
          # macos-13 has been retired by GitHub; macos-15-intel is the remaining x64 macOS image.
          - { label: mac-x64, runner: macos-15-intel, platform: mac, arch: x64, optional: false }
          - { label: linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64, optional: false }
          - { label: win-x64, runner: windows-2022, platform: win, arch: x64, optional: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check tag against package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install shell dependencies
        run: npm ci

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Build web interface
        run: npm run build:web

      - name: Build backend (PyInstaller)
        run: npm run build:backend

      - name: Package (electron-builder)
        run: node scripts/dist.mjs ${{ matrix.platform }} --prebuilt --arch ${{ matrix.arch }}

      - name: Collect packages
        run: node scripts/release-assets.mjs collect upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.label }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Check required packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in mac-arm64.zip mac-x64.zip linux-x64.tar.gz linux-x64.AppImage; do
            test -f "dist/ANet-Relay-${version}-${f}" || { echo "missing ANet-Relay-${version}-${f}" >&2; exit 1; }
          done
          ls -l dist

      - name: Checksums
        run: node scripts/release-assets.mjs checksums dist

      - name: Release notes
        run: node scripts/release-assets.mjs notes "${GITHUB_REF_NAME}" release-notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ANet Relay ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
