# electron-builder 26.18.0 configuration (03 §13).
# Build through the npm scripts (dist:mac / dist:linux / dist:win), which build the
# web interface and the PyInstaller backend first and select the host architecture.
appId: org.agentnetwork.relay
productName: ANet Relay
copyright: Copyright © 2026 Agent Network
artifactName: ANet-Relay-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: brand
files:
  - package.json
  - electron/**/*
  - "!electron/**/*.d.ts"
  # Copilot ships as agent.bundle.mjs (scripts/build-copilot.mjs); its sources need devDependencies.
  - "!electron/copilot/agent.mjs"
  - "!electron/copilot/tools-*.mjs"
  - "!electron/copilot/test/**"
  - "!electron/test/**"
  - web/dist/**/*
  - brand/icon.png
extraResources:
  # PyInstaller onedir output of backend/relay-backend.spec (npm run build:backend).
  - from: pyi-dist/anet-relay-backend
    to: backend
  # Autopilot runtime packs of this platform (11 §3.2, docs/autopilot-packs.md), downloaded by
  # scripts/fetch-autopilots.mjs in release.yml; absent in local builds, which then ship none.
  # scripts/after-pack.cjs signs their Mach-O executables on macOS.
  - from: build/autopilots
    to: autopilots
# No auto-update feed: releases are downloaded from GitHub by hand.
publish: null
# macOS signing is done by this hook, not by electron-builder (identity stays null): Developer ID with the
# Hardened Runtime and notarization when MAC_SIGN_IDENTITY and the App Store Connect API key are set,
# otherwise an ad-hoc signature. It runs before the zip and dmg are made.
afterPack: scripts/after-pack.cjs

mac:
  target:
    - target: zip
    - target: dmg
  icon: brand/icon.icns
  category: public.app-category.developer-tools
  identity: null
  # Hardened Runtime and brand/entitlements.mac.plist are applied by scripts/after-pack.cjs.
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: ANet Relay shows the video feed from a connected capture device.
    NSLocalNetworkUsageDescription: ANet Relay discovers and controls aircraft on the local network over MAVLink.

# DMG window (05 §3): brand/dmg-background.png (660 x 420) with its @2x twin, app on the left, Applications on the
# right. The art keeps the label band (y 290-320) dark enough for the white icon labels.
dmg:
  background: brand/dmg-background.png
  iconSize: 112
  window: { width: 660, height: 420 }
  contents:
    - { x: 180, y: 236, type: file }
    - { x: 480, y: 236, type: link, path: /Applications }

linux:
  target:
    - target: tar.gz
    - target: AppImage
  icon: brand/icon.png
  category: Utility
  executableName: anet-relay
  syncDesktopName: true
  synopsis: Ground control for agent swarms
  description: Desktop ground control for small MAVLink aircraft on a local network, with human possession and agent handback.

win:
  target:
    - target: nsis
  icon: brand/icon.ico
  executableName: ANet Relay

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ANet-Relay-${version}-${os}-${arch}.${ext}
  # wizard art (05 §3): 164 x 314 sidebar on the welcome and finish pages, 150 x 57 header, 24-bit BMP
  installerSidebar: brand/installer-sidebar.bmp
  uninstallerSidebar: brand/installer-sidebar.bmp
  installerHeader: brand/installer-header.bmp
