<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">汤圆 U7 自主飞行系统流程</title>
  <desc id="desc">A clean light-background diagram showing the perception, localization, mapping, planning, and flight-control flow of the Tangyuan U7 indoor UAV.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#8b9293" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#e82127" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "SF Pro Rounded", "Arial Rounded MT Bold", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .brand { fill:#171a1b; font-size:62px; font-weight:800; letter-spacing:1px; }
      .subtitle { fill:#6a7274; font-size:25px; font-weight:600; letter-spacing:0.4px; }
      .section { fill:#171a1b; font-size:25px; font-weight:800; }
      .number { fill:#e82127; font-size:22px; font-weight:800; }
      .name { fill:#171a1b; font-size:30px; font-weight:800; }
      .desc { fill:#5d6668; font-size:20px; font-weight:600; }
      .topic { fill:#353d3f; font-family:Consolas, "Cascadia Code", monospace; font-size:18px; font-weight:600; }
      .foot { fill:#687173; font-size:18px; font-weight:600; }
      .line { fill:none; stroke:#8b9293; stroke-width:2.4; stroke-linecap:round; marker-end:url(#arrow-gray); }
      .mainline { fill:none; stroke:#e82127; stroke-width:2.6; stroke-linecap:round; marker-end:url(#arrow-red); }
      .feedback { fill:none; stroke:#a3aaab; stroke-width:2; stroke-dasharray:8 8; stroke-linecap:round; marker-end:url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>
  <text x="72" y="91" class="brand">汤圆 U7</text>
  <text x="74" y="134" class="subtitle">室内无人机自主飞行系统　·　定位　建图　规划　飞控</text>
  <path d="M72 178H1728" stroke="#e9ebeb" stroke-width="2"/>

  <text x="72" y="232" class="number">01</text>
  <text x="118" y="232" class="section">感知与定位</text>

  <!-- top row: five simple modules -->
  <g>
    <text x="72" y="320" class="name">MID360S</text>
    <text x="72" y="356" class="desc">激光雷达 · IMU</text>
    <text x="72" y="400" class="topic">点云 / IMU</text>

    <text x="410" y="320" class="name">Livox Driver 2</text>
    <text x="410" y="356" class="desc">设备连接与数据发布</text>
    <text x="410" y="400" class="topic">/livox/lidar</text>
    <text x="410" y="430" class="topic">/livox/imu</text>

    <text x="748" y="320" class="name">FAST-LIO2</text>
    <text x="748" y="356" class="desc">激光惯性里程计</text>
    <text x="748" y="400" class="topic">/Odom_high_freq</text>
    <text x="748" y="430" class="topic">/cloud_registered</text>

    <text x="1086" y="320" class="name">定位桥接</text>
    <text x="1086" y="356" class="desc">fastlio_locate</text>
    <text x="1086" y="400" class="topic">/mavros/vision_pose/pose</text>

    <text x="1424" y="320" class="name">MAVROS + PX4</text>
    <text x="1424" y="356" class="desc">飞控状态与位置反馈</text>
    <text x="1424" y="400" class="topic">/mavros/state</text>
    <text x="1424" y="430" class="topic">local_position/odom</text>
  </g>

  <path d="M280 270H390" class="line"/>
  <path d="M620 270H728" class="line"/>
  <path d="M970 270H1066" class="line"/>
  <path d="M1330 270H1404" class="line"/>

  <path d="M860 456V528H170V660" class="line"/>
  <text x="487" y="516" class="foot">配准点云</text>

  <text x="72" y="606" class="number">02</text>
  <text x="118" y="606" class="section">建图与轨迹控制</text>

  <!-- bottom row: four simple modules -->
  <g>
    <text x="110" y="700" class="name">地面点云滤波</text>
    <text x="110" y="736" class="desc">ground_filter</text>
    <text x="110" y="780" class="topic">/cloud_registered_filter</text>

    <text x="545" y="700" class="name">EGO-Planner</text>
    <text x="545" y="736" class="desc">局部建图与轨迹规划</text>
    <text x="545" y="780" class="desc">点云 + 配置后的里程计</text>

    <text x="980" y="700" class="name">轨迹服务器</text>
    <text x="980" y="736" class="desc">traj_server</text>
    <text x="980" y="780" class="topic">/drone_0_planning/pos_cmd</text>

    <text x="1415" y="700" class="name">自主飞行 FSM</text>
    <text x="1415" y="736" class="desc">状态管理 · OFFBOARD</text>
    <text x="1415" y="780" class="topic">/mavros/setpoint_raw/local</text>
  </g>

  <path d="M390 660H520" class="line"/>
  <path d="M825 660H955" class="line"/>
  <path d="M1260 660H1390" class="mainline"/>
  <path d="M1540 654V480H1548V456" class="mainline"/>

  <path d="M1548 456V550H700V660" class="feedback"/>
  <text x="965" y="538" class="foot">里程计输入需与 odometry_topic 匹配</text>

  <path d="M72 900H1728" stroke="#e9ebeb" stroke-width="2"/>
  <text x="72" y="956" class="foot">实机启动前：核对 MID360S 网络、雷达外参、坐标系与 PX4 EKF 配置。</text>
  <text x="72" y="995" class="foot">FSM 会尝试进入 OFFBOARD、解锁并起飞；首次验证请在仿真或拆桨条件下进行。</text>
</svg>
