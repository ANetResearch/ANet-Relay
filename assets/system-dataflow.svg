<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Indoor UAV autonomy system data flow</title>
  <desc id="desc">Livox MID360 data flows through FAST-LIO2 and ground filtering to EGO Planner; odometry is bridged to MAVROS and PX4, while the planner command is followed by the flight state machine and returned to PX4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2c"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d7c6"/>
      <stop offset="1" stop-color="#8ee4b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#66d9cf"/>
    </marker>
    <marker id="arrow-lime" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#b6e36c"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#ff9b78"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { fill: #eff8f7; font-size: 46px; font-weight: 700; }
      .subtitle { fill: #a8bbc4; font-size: 22px; }
      .lane { fill: #8aa0aa; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .box { fill: #162536; stroke: #31485a; stroke-width: 2; }
      .sensor { stroke: #70d7ca; }
      .compute { stroke: #8ed7b1; }
      .planner { stroke: #c4df77; }
      .flight { stroke: #ffab82; }
      .box-title { fill: #f1f7f7; font-size: 25px; font-weight: 700; }
      .box-sub { fill: #adc0c9; font-size: 18px; }
      .topic { fill: #c7f2eb; font-size: 16px; font-family: Consolas, "Courier New", monospace; }
      .small { fill: #a2b5be; font-size: 16px; }
      .pill { fill: #20364a; stroke: #456174; stroke-width: 1; }
      .pill-text { fill: #d8e7e8; font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1920" height="1080" rx="28" fill="url(#bg)"/>
  <path d="M0 154H1920" stroke="#243746" stroke-width="2"/>
  <text x="72" y="92" class="title">室内无人机自主飞行 · 系统数据流</text>
  <text x="74" y="128" class="subtitle">ROS 2 Humble  /  Livox MID360  /  FAST-LIO2  /  EGO-Planner  /  PX4 + MAVROS</text>

  <text x="74" y="205" class="lane">01  感知与定位</text>
  <text x="74" y="577" class="lane">02  环境建图与轨迹控制</text>

  <g filter="url(#shadow)">
    <rect x="72" y="235" width="250" height="180" rx="18" class="box sensor"/>
    <rect x="366" y="235" width="270" height="180" rx="18" class="box sensor"/>
    <rect x="680" y="235" width="310" height="180" rx="18" class="box compute"/>
    <rect x="1075" y="235" width="300" height="180" rx="18" class="box compute"/>
    <rect x="1460" y="235" width="380" height="180" rx="18" class="box flight"/>

    <rect x="366" y="625" width="270" height="170" rx="18" class="box sensor"/>
    <rect x="720" y="625" width="350" height="170" rx="18" class="box planner"/>
    <rect x="1160" y="625" width="280" height="170" rx="18" class="box planner"/>
    <rect x="1530" y="625" width="310" height="170" rx="18" class="box flight"/>
  </g>

  <text x="102" y="282" class="box-title">Livox MID360</text>
  <text x="102" y="318" class="box-sub">激光雷达 + IMU</text>
  <rect x="102" y="348" width="190" height="36" rx="18" class="pill"/>
  <text x="120" y="372" class="pill-text">机载传感器输入</text>

  <text x="396" y="282" class="box-title">Livox ROS Driver 2</text>
  <text x="396" y="318" class="box-sub">设备发现 · 数据发布</text>
  <text x="396" y="362" class="topic">/livox/lidar</text>
  <text x="396" y="390" class="topic">/livox/imu</text>

  <text x="710" y="282" class="box-title">FAST-LIO2</text>
  <text x="710" y="318" class="box-sub">激光惯性里程计</text>
  <text x="710" y="362" class="topic">/Odom_high_freq</text>
  <text x="710" y="390" class="topic">/cloud_registered</text>

  <text x="1105" y="282" class="box-title">定位桥接</text>
  <text x="1105" y="318" class="box-sub">fastlio_locate</text>
  <text x="1105" y="362" class="topic">/mavros/vision_pose/pose</text>
  <text x="1105" y="390" class="small">外部位姿输入 · EKF 融合</text>

  <text x="1490" y="282" class="box-title">MAVROS + PX4</text>
  <text x="1490" y="318" class="box-sub">飞控状态 · 本地位置反馈</text>
  <text x="1490" y="362" class="topic">/mavros/state</text>
  <text x="1490" y="390" class="topic">/mavros/local_position/odom</text>

  <text x="396" y="671" class="box-title">地面点云滤波</text>
  <text x="396" y="707" class="box-sub">ground_filter</text>
  <text x="396" y="755" class="topic">/cloud_registered_filter</text>

  <text x="750" y="671" class="box-title">EGO-Planner</text>
  <text x="750" y="707" class="box-sub">局部环境建图 · 在线轨迹规划</text>
  <text x="750" y="755" class="topic">cloud + configured odometry</text>

  <text x="1190" y="671" class="box-title">轨迹服务器</text>
  <text x="1190" y="707" class="box-sub">traj_server</text>
  <text x="1190" y="755" class="topic">/drone_0_planning/pos_cmd</text>

  <text x="1560" y="671" class="box-title">自主飞行 FSM</text>
  <text x="1560" y="707" class="box-sub">状态管理 · OFFBOARD 设定值</text>
  <text x="1560" y="755" class="topic">/mavros/setpoint_raw/local</text>

  <path d="M322 325H354" fill="none" stroke="#66d9cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>
  <path d="M636 325H668" fill="none" stroke="#66d9cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>
  <path d="M990 325H1063" fill="none" stroke="#66d9cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>
  <path d="M1375 325H1448" fill="none" stroke="#66d9cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>
  <text x="991" y="300" class="small">里程计</text>

  <path d="M835 415V520H500V613" fill="none" stroke="#b6e36c" stroke-width="5" marker-end="url(#arrow-lime)"/>
  <text x="690" y="510" class="small">配准点云</text>
  <path d="M636 710H708" fill="none" stroke="#b6e36c" stroke-width="5" marker-end="url(#arrow-lime)"/>
  <path d="M1070 710H1148" fill="none" stroke="#b6e36c" stroke-width="5" marker-end="url(#arrow-lime)"/>
  <path d="M1440 710H1518" fill="none" stroke="#b6e36c" stroke-width="5" marker-end="url(#arrow-lime)"/>
  <path d="M1685 625V480H1650V427" fill="none" stroke="#ff9b78" stroke-width="5" marker-end="url(#arrow-coral)"/>

  <path d="M1540 415V520H1035V613" fill="none" stroke="#8298a4" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow-cyan)"/>
  <rect x="1070" y="485" width="420" height="42" rx="21" fill="#142232" stroke="#31485a"/>
  <text x="1092" y="513" class="small">规划器里程计话题需与实际输入配置一致</text>

  <path d="M72 876H1840" stroke="#243746" stroke-width="2"/>
  <circle cx="94" cy="930" r="7" fill="#66d9cf"/>
  <text x="115" y="936" class="small">定位 / 状态反馈</text>
  <circle cx="360" cy="930" r="7" fill="#b6e36c"/>
  <text x="381" y="936" class="small">环境感知 / 规划命令</text>
  <circle cx="700" cy="930" r="7" fill="#ff9b78"/>
  <text x="721" y="936" class="small">飞控 setpoint</text>
  <text x="72" y="1000" class="small">提示：当前规划启动默认里程计参数为 Odometry；真机接入前请显式核对 odom_topic、坐标系、传感器外参和 PX4 EKF 配置。</text>
</svg>
