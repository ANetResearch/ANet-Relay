<!doctype html>
<html lang="en" class="dark" data-lang="en" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'" />
    <title>ANet Relay</title>
    <link rel="icon" type="image/png" href="./brand/favicon-32.png" />
    <!-- First frame (02 §15): g950 window, the ANet mark revealed left to right, RELAY under it, a 160 x 1 progress
         hairline 64 above the bottom. These rules run before any script; app/boot.ts takes over the same nodes.
         v0.3 (05 §2): for the Full and Short openings (html[data-boot="film"]) act 0 is the bare g950 window; the
         mark and the hairline wait for app/bootCinema.ts, which adds #boot-film and #boot-voxels and data-film. -->
    <style>
      /*BOOT_TOKENS*/
      html, body { margin: 0; height: 100%; background: var(--g950); }
      #boot-mask { position: fixed; inset: 0; z-index: 100; background: var(--g950); transition: opacity 250ms cubic-bezier(0.22, 1, 0.36, 1); will-change: opacity; }
      #boot-mask[data-state="revealed"] { opacity: 0; pointer-events: none; }
      #boot-mask .boot-mark { position: absolute; left: 50%; top: calc(50% - 24px); width: 168px; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #boot-mask .boot-logo { width: 168px; height: auto; display: block; clip-path: inset(0 100% 0 0); opacity: 0; animation: boot-reveal 400ms cubic-bezier(0.22, 1, 0.36, 1) 120ms forwards; }
      #boot-mask .boot-logo svg { display: block; width: 100%; height: auto; }
      #boot-mask .boot-word { font: 300 13px/16px "Inter Variable", "Inter", -apple-system, "Segoe UI", sans-serif; color: var(--g300); letter-spacing: 0.6em; margin-right: -0.42em; opacity: 0; animation: boot-word 400ms cubic-bezier(0.22, 1, 0.36, 1) 420ms forwards; }
      #boot-mask .boot-bar { position: absolute; left: 50%; bottom: 64px; transition: bottom 250ms cubic-bezier(0.22, 1, 0.36, 1); width: 160px; height: 1px; translate: -50% 0; background: oklch(1 0 0 / 0.06); overflow: hidden; opacity: 0; animation: boot-fade 250ms cubic-bezier(0.22, 1, 0.36, 1) 520ms forwards; }
      #boot-mask .boot-bar > i { position: absolute; inset: 0; background: var(--g50); transform-origin: left center; transform: scaleX(var(--boot-p, 0)); transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1); }
      #boot-mask .boot-status { position: absolute; left: 50%; top: calc(100% - 48px); translate: -50% 0; width: 480px; max-width: calc(100vw - 32px); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; font: 450 11px/16px "Inter Variable", "Inter", -apple-system, "Segoe UI", "PingFang SC", sans-serif; color: var(--g500); }
      #boot-mask .boot-status:empty { display: none; }
      #boot-mask:is([data-phase="failed"], [data-phase="ports"]) .boot-bar { bottom: 136px; }
      #boot-mask:is([data-phase="failed"], [data-phase="ports"]) .boot-status { top: calc(100% - 120px); }
      @keyframes boot-reveal { to { clip-path: inset(0 0 0 0); opacity: 1; } }
      @keyframes boot-word { to { opacity: 1; letter-spacing: 0.42em; } }
      @keyframes boot-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-mask .boot-logo, #boot-mask .boot-word, #boot-mask .boot-bar { animation: none; opacity: 1; clip-path: none; letter-spacing: 0.42em; }
        #boot-mask, #boot-mask .boot-bar > i { transition-duration: 0ms; }
      }
      html[data-motion="off"] #boot-mask .boot-logo, html[data-motion="off"] #boot-mask .boot-word, html[data-motion="off"] #boot-mask .boot-bar { animation: none; opacity: 1; clip-path: none; letter-spacing: 0.42em; }
      html[data-boot="film"]:not([data-motion="reduced"]):not([data-motion="off"]) #boot-mask:not([data-film]) :is(.boot-mark, .boot-bar) { visibility: hidden; animation: none; }
    </style>
    <script>
      // Language and motion before first paint: the persisted language picks the boot copy; ?motion=off freezes motion.
      // The opening setting (relay.boot.mode, mirrored by Settings) picks the first frame: Minimal draws the v0.2
      // mark at once, Full and Short leave act 0 bare for the film.
      (function () {
        try {
          document.documentElement.dataset.boot = localStorage.getItem('relay.boot.mode') === 'minimal' ? 'minimal' : 'film'
        } catch (e) {
          document.documentElement.dataset.boot = 'film'
        }
        try {
          var q = new URLSearchParams(location.search)
          var l = q.get('lang') || localStorage.getItem('relay.lang')
          if (l === 'zh') { document.documentElement.lang = 'zh-CN'; document.documentElement.dataset.lang = 'zh' }
          var m = q.get('motion')
          if (m === 'off' || m === 'reduced') document.documentElement.dataset.motion = m
          else if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.motion = 'reduced'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="boot-mask" data-state="booting" role="status" aria-live="polite" aria-label="ANet Relay">
      <div class="boot-mark">
        <div class="boot-logo"><!--BOOT_LOGO--></div>
        <div class="boot-word">RELAY</div>
      </div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-status" id="boot-status"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
